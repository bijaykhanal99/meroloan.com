name: Deploy Mero Loan to GitHub Pages

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: false

jobs:
deploy:
environment:
name: github-pages
url: ${{ https://bijaykhanal99.github.io/meroloan.com/ }}
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  
  - name: Prepare static site with secret config
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: |
      mkdir -p site
      cp index.html site/index.html
      cat <<EOF > site/config.js
      window.MERO_LOAN_SUPABASE_CONFIG = {
        url: "${https://mtfvmasgbhrzkwwstras.supabase.co}",
        anonKey: "${eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10ZnZtYXNnYmhyemt3d3N0cmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNDQ1MDgsImV4cCI6MjExMDkyMDUwOH0.jINIsa8kHp8dJJd_7NGizZWe79K1LGkbmGjYj_Ukmpk}"
      };
      EOF

  - name: Setup Pages
    uses: actions/configure-pages@v5

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: "site"

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
